services:
  - type: web
    name: market-ops-console
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - "**/*.md"
        - docs/**
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: 0.0.0.0
