name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'staging' }}
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch'
        && (inputs.environment != 'production' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment || 'staging' }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          load: true
          push: false
          tags: market-ops-console:${{ env.DEPLOY_SHA }}
          cache-from: type=gha

      - name: Smoke test the release image
        run: scripts/smoke-test.sh "market-ops-console:${DEPLOY_SHA}"

      - name: Deploy (stub)
        env:
          TARGET: ${{ inputs.environment || 'staging' }}
        run: |
          echo "::notice::Deploy target is not configured yet; skipping the actual release."
          {
            echo "### Deploy (stub)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`${TARGET}\` |"
            echo "| Commit | \`${DEPLOY_SHA}\` |"
            echo "| Image | \`market-ops-console:${DEPLOY_SHA}\` (built and smoke-tested) |"
            echo ""
            echo "Nothing was released. Wire the real target in \`.github/workflows/deploy.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
